apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: library
  template:
    metadata:
      labels:
        app: library
    spec:
      containers:
      - name: library
        image: messay2025/ict-library-service:latest
        env:
        - name: DATABASE_URL
          value: "postgresql://user:pass@postgres-service:5432/librarydb"
        - name: JWT_SECRET
          value: "super-secret-key"
---
apiVersion: v1
kind: Service
metadata:
  name: library-service
spec:
  type: LoadBalancer
  selector:
    app: library
  ports:
  - port: 5001
    targetPort: 5001